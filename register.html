<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration | SmartCare</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="site-header">
    <nav class="navbar container">
        <a href="index.html" class="logo">
            <span class="logo-icon">✚</span>
            Smart<span>Care</span>
        </a>

        <a href="login.html" class="btn btn-secondary">Already have an account?</a>
    </nav>
</header>


<main class="section">

    <div class="container form-page">

        <div class="section-heading">
            <span class="section-label">PATIENT REGISTRATION</span>
            <h1>Create your SmartCare account</h1>
            <p>Enter your information to create a patient profile.</p>
        </div>


        <form action="#" method="post" class="large-form">

            <div class="form-grid">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name"
                           placeholder="Enter full name" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           placeholder="example@email.com">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone"
                           placeholder="Enter phone number">
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender">
                        <option>Select gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                        <option>Prefer not to say</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city"
                           placeholder="Enter city">
                </div>

                <div class="form-group full-span">
                    <label for="address">Address</label>
                    <textarea id="address" name="address"
                              placeholder="Enter your complete address"></textarea>
                </div>

                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password"
                           name="password">
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password"
                           name="confirm-password">
                </div>

            </div>

            <label class="checkbox-label terms">
                <input type="checkbox" required>
                I agree to the SmartCare terms and conditions.
            </label>

            <button type="submit" class="btn btn-primary">
                Create Account
            </button>

        </form>

    </div>

</main>

</body>
</html>
